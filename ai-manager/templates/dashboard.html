{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <div>
        <h1 class="h3 mb-1">{{ settings.ai_server_name }}</h1>
        <p class="text-secondary m-0">On-demand AI appliance control plane</p>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-success" hx-post="/server/start" hx-swap="none">Start</button>
        <button class="btn btn-warning" hx-post="/server/restart" hx-swap="none">Restart</button>
        <button class="btn btn-danger" hx-post="/server/shutdown" hx-swap="none">Shutdown</button>
        <button class="btn btn-info" hx-post="/keepalive" hx-swap="none">Keep Alive (+60m)</button>
        <button class="btn btn-outline-light" hx-get="/partials/status" hx-target="#status-card" hx-swap="outerHTML">Refresh</button>
    </div>
</div>

<div id="status-card" hx-get="/partials/status" hx-trigger="load, every 15s" hx-swap="outerHTML">
    {% include "partials/status_card.html" %}
</div>

{% if enable_timeline %}
<div class="mt-4">
    <a href="/timeline" class="btn btn-outline-secondary btn-sm">Open Timeline</a>
</div>
{% endif %}
{% endblock %}
